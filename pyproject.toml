[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uik-reconcile"
version = "1.0.1"
description = "Локальная сверка Excel и Google Таблиц"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7",
  "openpyxl>=3.1,<4",
  "google-api-python-client>=2.150,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth>=2.35,<3",
  "google-auth-httplib2>=0.2,<1",
  "httplib2>=0.22,<1",
  "keyring>=25,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyinstaller>=6.11,<7"]

[project.scripts]
uik-reconcile = "uik_reconcile.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
